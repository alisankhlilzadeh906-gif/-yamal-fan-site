<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اخبار لامین یامال | هواداران یامال</title>
  <meta name="description" content="آخرین اخبار و مطالب مربوط به لامین یامال">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      transition: 0.3s;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #111;
      color: white;
      padding: 14px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    .logo {
      color: #ffd700;
      font-size: 22px;
      font-weight: bold;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 10px;
      transition: 0.3s;
      font-size: 14px;
    }

    nav a:hover,
    nav a.active {
      background: #ffd700;
      color: #111;
    }

    .header-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dark-btn,
    .menu-btn {
      border: none;
      background: #222;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .menu-btn {
      display: none;
    }

    /* HERO */
    .hero {
      padding: 65px 20px 45px;
      text-align: center;
      background: linear-gradient(135deg, #111, #222, #111);
      color: white;
    }

    .hero h1 {
      font-size: 38px;
      color: #ffd700;
      margin-bottom: 15px;
    }

    .hero p {
      color: #ddd;
      font-size: 17px;
    }

    /* MAIN */
    main {
      max-width: 1050px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    /* SEARCH */
    .search-box {
      display: flex;
      max-width: 700px;
      margin: 0 auto 30px;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 15px;
      font-size: 15px;
      direction: rtl;
    }

    .search-box button {
      border: none;
      background: #ffd700;
      color: #111;
      padding: 0 22px;
      cursor: pointer;
      font-weight: bold;
    }

    /* NEWS COUNTER */
    .news-info {
      text-align: center;
      margin-bottom: 25px;
      color: #666;
    }

    /* NEWS CARD */
    .news-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      margin-bottom: 25px;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .news-card h2 {
      color: #111;
      font-size: 25px;
      margin-bottom: 15px;
      line-height: 1.7;
    }

    .news-card p {
      color: #555;
      line-height: 2;
      font-size: 16px;
    }

    .news-number {
      display: inline-block;
      background: #ffd700;
      color: #111;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    /* ACTIONS */
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .like-btn {
      border: none;
      background: #f1f1f1;
      padding: 11px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
    }

    .like-btn.liked {
      background: #ffd700;
    }

    .navigation {
      display: flex;
      gap: 10px;
    }

    .navigation button {
      border: none;
      background: #111;
      color: white;
      padding: 11px 18px;
      border-radius: 12px;
      cursor: pointer;
    }

    .navigation button:hover {
      background: #333;
    }

    /* COMMENTS */
    .comments {
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #ddd;
    }

    .comments h3 {
      margin-bottom: 15px;
    }

    .comment-form {
      display: flex;
      gap: 10px;
    }

    .comment-form input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .comment-form button {
      border: none;
      background: #ffd700;
      padding: 0 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .comment-list {
      margin-top: 15px;
    }

    .comment {
      background: #f5f5f5;
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 8px;
    }

    /* NO RESULT */
    .no-result {
      display: none;
      text-align: center;
      background: white;
      padding: 35px;
      border-radius: 20px;
      color: #666;
    }

    /* FOOTER */
    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 15px;
    }

    footer strong {
      color: #ffd700;
    }

    /* DARK MODE */
    body.dark {
      background: #0d0d0d;
      color: #eee;
    }

    body.dark .search-box,
    body.dark .news-card,
    body.dark .no-result {
      background: #181818;
      color: #eee;
    }

    body.dark .news-card h2 {
      color: #ffd700;
    }

    body.dark .news-card p {
      color: #ccc;
    }

    body.dark .news-info {
      color: #aaa;
    }

    body.dark .comments {
      border-color: #333;
    }

    body.dark .comment {
      background: #252525;
    }

    body.dark .comment-form input {
      background: #222;
      color: white;
      border-color: #444;
    }

    body.dark .like-btn {
      background: #292929;
      color: white;
    }

    body.dark .like-btn.liked {
      background: #ffd700;
      color: #111;
    }

    /* MOBILE */
    @media (max-width: 800px) {

      header {
        padding: 12px 18px;
      }

      .menu-btn {
        display: block;
      }

      nav {
        display: none;
        position: absolute;
        top: 68px;
        right: 15px;
        left: 15px;
        background: #111;
        padding: 12px;
        border-radius: 15px;
        flex-direction: column;
      }

      nav.show {
        display: flex;
      }

      nav a {
        width: 100%;
        text-align: center;
      }

      .hero {
        padding: 45px 18px 35px;
      }

      .hero h1 {
        font-size: 29px;
      }

      .hero p {
        font-size: 15px;
      }

      .news-card {
        padding: 20px;
      }

      .news-card h2 {
        font-size: 21px;
      }

      .news-card p {
        font-size: 15px;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .navigation {
        width: 100%;
      }

      .navigation button {
        flex: 1;
      }

      .comment-form {
        flex-direction: column;
      }

      .comment-form button {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Lamine Yamal</div>

  <nav id="nav">
    <a href="index.html">خانه</a>
    <a href="news.html" class="active">اخبار</a>
    <a href="stats.html">آمار</a>
    <a href="honors.html">افتخارات</a>
    <a href="profile.html">پروفایل</a>
    <a href="contact.html">تماس با ما</a>
    <a href="login.html">ورود / ثبت‌نام</a>
  </nav>

  <div class="header-buttons">
    <button class="dark-btn" onclick="toggleDark()" id="darkBtn">🌙</button>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
  </div>
</header>

<section class="hero">
  <h1>📰 اخبار لامین یامال</h1>
  <p>جدیدترین خبرها و مطالب مربوط به ستاره جوان بارسلونا</p>
</section>

<main>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="جستجو بین اخبار..."
      oninput="searchNews()"
    >
    <button onclick="searchNews()">جستجو</button>
  </div>

  <div class="news-info" id="newsInfo">
    خبر ۱ از ۸
  </div>

  <article class="news-card" id="newsCard">

    <span class="news-number" id="newsNumber">
      خبر ۱
    </span>

    <h2 id="newsTitle"></h2>

    <p id="newsText"></p>

    <div class="actions">

      <button class="like-btn" id="likeBtn" onclick="toggleLike()">
        ❤️ پسندیدن <span id="likeCount">0</span>
      </button>

      <div class="navigation">
        <button onclick="previousNews()">❮ قبلی</button>
        <button onclick="nextNews()">بعدی ❯</button>
      </div>

    </div>

    <div class="comments">

      <h3>💬 نظرات</h3>

      <div class="comment-form">
        <input
          type="text"
          id="commentInput"
          placeholder="نظر خود را بنویسید..."
        >
        <button onclick="addComment()">ارسال</button>
      </div>

      <div class="comment-list" id="commentList"></div>

    </div>

  </article>

  <div class="no-result" id="noResult">
    🔎 خبری با این عبارت پیدا نشد.
  </div>

</main>

<footer>
  <p>© 2026 <strong>Lamine Yamal Fan Site</strong></p>
  <p>ساخته شده برای هواداران لامین یامال 💛❤️</p>
</footer>

<script>

const news = [

  {
    title: "سوپرخرید منچسترسیتی را تحقیر کرد",
    text: "لامین یامال بار دیگر با نمایش فوق‌العاده خود توجه فوتبال‌دوستان را جلب کرد و در جریان مسابقه با حرکات تکنیکی و تصمیم‌های سریع خود تفاوت ایجاد کرد."
  },

  {
    title: "پیام جالب یامال: عاشقم باشید یا متنفر، مهم نیست",
    text: "لامین یامال درباره فشار رسانه‌ای و واکنش هواداران صحبت کرد و تأکید داشت که تمرکز اصلی او روی فوتبال و پیشرفت خودش است."
  },

  {
    title: "آقای خاص نامش عوض شد: لامین یامال",
    text: "عملکردهای درخشان یامال باعث شده توجه بسیاری از چهره‌های بزرگ فوتبال به او جلب شود. استعداد و اعتمادبه‌نفس او در سن پایین یکی از موضوعات مورد بحث فوتبال اروپا است."
  },

  {
    title: "انگلیس ۲-۳ اسپانیا: ریمونتادای قهرمان جهان در ومبلی",
    text: "اسپانیا در یک مسابقه جذاب توانست نتیجه را تغییر دهد و در ومبلی به پیروزی برسد. لامین یامال نیز یکی از بازیکنان مهم تیم اسپانیا بود."
  },

  {
    title: "یامال: ومبلی خیلی ورزشگاه سختی است",
    text: "یامال پس از مسابقه درباره فضای ومبلی و سختی بازی صحبت کرد و از عملکرد تیم ملی اسپانیا ابراز رضایت کرد."
  },

  {
    title: "یامال فاش کرد: پس از قهرمانی به مسی چه گفتم",
    text: "لامین یامال درباره ارتباط خود با لیونل مسی و خاطراتی که از دوران حضور در کنار او دارد صحبت کرد و از تأثیر مسی بر نسل جدید فوتبال گفت."
  },

  {
    title: "مربی ۶۵ ساله بیست کیلو جلو بازو می‌زند!",
    text: "یکی از مطالب جالب دنیای فوتبال درباره تمرینات و آمادگی جسمانی مربیان و بازیکنان منتشر شد و واکنش‌های زیادی در میان هواداران ایجاد کرد."
  },

  {
    title: "فقط دو دقیقه! یامال نگذاشت ومبلی نفس بکشد",
    text: "یامال در مدت کوتاهی توانست با حرکات تکنیکی و سرعت بالای خود خط دفاعی حریف را تحت فشار قرار دهد و بار دیگر استعداد خود را نشان دهد."
  }

];

let currentNews = 0;

let likes =
  JSON.parse(localStorage.getItem("yamalLikes")) || {};

let comments =
  JSON.parse(localStorage.getItem("yamalComments")) || {};

function showNews(index) {

  currentNews = (index + news.length) % news.length;

  const item = news[currentNews];

  document.getElementById("newsNumber").textContent =
    `خبر ${currentNews + 1}`;

  document.getElementById("newsTitle").textContent =
    item.title;

  document.getElementById("newsText").textContent =
    item.text;

  document.getElementById("newsInfo").textContent =
    `خبر ${currentNews + 1} از ${news.length}`;

  updateLike();

  showComments();

  document.getElementById("searchInput").value = "";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function nextNews() {
  showNews(currentNews + 1);
}

function previousNews() {
  showNews(currentNews - 1);
}

function toggleLike() {

  likes[currentNews] =
    likes[currentNews] ? likes[currentNews] + 1 : 1;

  localStorage.setItem(
    "yamalLikes",
    JSON.stringify(likes)
  );

  updateLike();
}

function updateLike() {

  const count = likes[currentNews] || 0;

  document.getElementById("likeCount").textContent = count;

  const btn = document.getElementById("likeBtn");

  if (count > 0) {
    btn.classList.add("liked");
  } else {
    btn.classList.remove("liked");
  }
}

function addComment() {

  const input =
    document.getElementById("commentInput");

  const text = input.value.trim();

  if (!text) return;

  if (!comments[currentNews]) {
    comments[currentNews] = [];
  }

  comments[currentNews].push(text);

  localStorage.setItem(
    "yamalComments",
    JSON.stringify(comments)
  );

  input.value = "";

  showComments();
}

function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

function showComments() {

  const list =
    document.getElementById("commentList");

  list.innerHTML = "";

  const currentComments =
    comments[currentNews] || [];

  currentComments.forEach(comment => {

    const div =
      document.createElement("div");

    div.className = "comment";

    div.innerHTML =
      escapeHTML(comment);

    list.appendChild(div);

  });
}

function searchNews() {

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const card =
    document.getElementById("newsCard");

  const noResult =
    document.getElementById("noResult");

  if (!query) {

    card.style.display = "block";

    noResult.style.display = "none";

    return;
  }

  const index =
    news.findIndex(item =>
      item.title.toLowerCase().includes(query) ||
      item.text.toLowerCase().includes(query)
    );

  if (index !== -1) {

    currentNews = index;

    const item = news[index];

    document.getElementById("newsNumber").textContent =
      `خبر ${index + 1}`;

    document.getElementById("newsTitle").textContent =
      item.title;

    document.getElementById("newsText").textContent =
      item.text;

    document.getElementById("newsInfo").textContent =
      `خبر ${index + 1} از ${news.length}`;

    updateLike();
    showComments();

    card.style.display = "block";
    noResult.style.display = "none";

  } else {

    card.style.display = "none";
    noResult.style.display = "block";

  }
}

/* DARK MODE */

function toggleDark() {

  document.body.classList.toggle("dark");

  const dark =
    document.body.classList.contains("dark");

  localStorage.setItem(
    "yamalDarkMode",
    dark
  );

  document.getElementById("darkBtn").textContent =
    dark ? "☀️" : "🌙";
}

function loadDarkMode() {

  const dark =
    localStorage.getItem("yamalDarkMode") === "true";

  if (dark) {

    document.body.classList.add("dark");

    document.getElementById("darkBtn").textContent =
      "☀️";
  }
}

/* MOBILE MENU */

function toggleMenu() {

  document
    .getElementById("nav")
    .classList.toggle("show");

}

/* SWIPE ON MOBILE */

let touchStartX = 0;

let touchEndX = 0;

document
  .getElementById("newsCard")
  .addEventListener("touchstart", e => {

    touchStartX = e.changedTouches[0].screenX;

  });

document
  .getElementById("newsCard")
  .addEventListener("touchend", e => {

    touchEndX = e.changedTouches[0].screenX;

    const difference =
      touchEndX - touchStartX;

    if (Math.abs(difference) > 60) {

      if (difference > 0) {
        nextNews();
      } else {
        previousNews();
      }

    }

  });

/* START */

loadDarkMode();

showNews(0);

</script>

</body>
</html>
