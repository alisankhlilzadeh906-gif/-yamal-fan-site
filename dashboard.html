<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حساب کاربری | Lamine Yamal</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>

<body>

<header>
  <nav>

    <a href="index.html" class="logo">
      ⚽ Lamine Yamal
    </a>

    <button
      class="mobile-menu"
      onclick="toggleMenu()"
      aria-label="منو"
    >
      ☰
    </button>

    <div class="nav-links" id="navLinks">

      <a href="index.html">خانه</a>
      <a href="news.html">اخبار</a>
      <a href="honors.html">افتخارات</a>
      <a href="profile.html">پروفایل یامال</a>
      <a href="contact.html">ارتباط با ما</a>

      <button
        id="darkButton"
        data-dark-mode
        onclick="toggleDarkMode()"
      >
        🌙
      </button>

      <button
        data-logout
        onclick="logout()"
      >
        🚪 خروج
      </button>

    </div>

  </nav>
</header>


<main>

  <section class="section">

    <div class="section-title">
      <h2>👤 حساب کاربری</h2>
      <p>مدیریت اطلاعات حساب و عکس پروفایل</p>
    </div>


    <div
      class="card"
      style="
        max-width:600px;
        margin:auto;
        text-align:center;
      "
    >

      <!-- عکس پروفایل -->
      <div>

        <img
          id="avatarPreview"
          src=""
          alt="عکس پروفایل"
          style="
            width:140px;
            height:140px;
            border-radius:50%;
            object-fit:cover;
            border:4px solid #2563eb;
            background:#e8eefc;
            display:block;
            margin:0 auto 20px;
          "
        >

      </div>


      <!-- انتخاب عکس -->
      <div style="margin-bottom:25px;">

        <label
          for="avatarInput"
          class="btn btn-primary"
          style="
            cursor:pointer;
            display:inline-block;
          "
        >
          📸 انتخاب عکس
        </label>

        <input
          type="file"
          id="avatarInput"
          accept="image/*"
          style="display:none;"
        >

      </div>


      <!-- نام کاربری -->
      <div style="margin-bottom:20px;text-align:right;">

        <label>
          نام کاربری
        </label>

        <input
          type="text"
          id="username"
          placeholder="در حال بارگذاری..."
          readonly
        >

      </div>


      <!-- ایمیل -->
      <div style="margin-bottom:20px;text-align:right;">

        <label>
          ایمیل
        </label>

        <input
          type="email"
          id="email"
          placeholder="در حال بارگذاری..."
          readonly
        >

      </div>


      <!-- وضعیت -->
      <div
        id="status"
        style="
          padding:12px;
          border-radius:10px;
          background:#eef2ff;
          color:#2563eb;
          margin-bottom:20px;
        "
      >
        در حال بارگذاری حساب...
      </div>


      <!-- خروج -->
      <button
        class="btn btn-primary"
        onclick="logout()"
        style="border:none;cursor:pointer;"
      >
        🚪 خروج از حساب
      </button>

    </div>

  </section>

</main>


<footer>

  <p>
    © 2026 Lamine Yamal Fan Website
  </p>

  <p style="margin-top:10px;opacity:.7;">
    حساب کاربری هواداران ⚽
  </p>

</footer>


<script src="app.js"></script>


<script>

let currentUser = null;


// عکس پیش‌فرض
function defaultAvatar() {

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="300"
           height="300"
           viewBox="0 0 300 300">

        <rect width="300" height="300" fill="#e8eefc"/>

        <circle
          cx="150"
          cy="110"
          r="55"
          fill="#2563eb"
        />

        <path
          d="M55 270
             C65 205 105 180 150 180
             C195 180 235 205 245 270"
          fill="#2563eb"
        />

      </svg>
    `);

}


// نمایش وضعیت
function setStatus(message, type = "info") {

  const status = document.getElementById("status");

  status.textContent = message;

  if (type === "success") {

    status.style.background = "#dcfce7";
    status.style.color = "#166534";

  } else if (type === "error") {

    status.style.background = "#fee2e2";
    status.style.color = "#991b1b";

  } else {

    status.style.background = "#eef2ff";
    status.style.color = "#2563eb";

  }

}


// بارگذاری حساب
async function loadAccount() {

  try {

    if (!window.sb) {

      setStatus(
        "Supabase به درستی متصل نشده است.",
        "error"
      );

      return;
    }


    const {
      data: {
        user
      },
      error: userError
    } = await sb.auth.getUser();


    if (userError || !user) {

      window.location.href = "login.html";
      return;
    }


    currentUser = user;


    document.getElementById("email").value =
      user.email || "";


    const {
      data: profile,
      error: profileError
    } = await sb
      .from("profiles")
      .select("username, avatar_url")
      .eq("id", user.id)
      .maybeSingle();


    if (profileError) {

      console.error(profileError);

      setStatus(
        "خطا در دریافت اطلاعات پروفایل.",
        "error"
      );

      return;
    }


    if (!profile) {

      setStatus(
        "پروفایل این حساب در جدول profiles پیدا نشد.",
        "error"
      );

      return;
    }


    document.getElementById("username").value =
      profile.username || "بدون نام";


    const avatar =
      profile.avatar_url || defaultAvatar();


    document.getElementById("avatarPreview").src =
      avatar;


    setStatus(
      "حساب کاربری با موفقیت بارگذاری شد.",
      "success"
    );


  } catch (error) {

    console.error(error);

    setStatus(
      "خطا در بارگذاری حساب.",
      "error"
    );

  }

}


// آپلود عکس
document
  .getElementById("avatarInput")
  .addEventListener("change", async function () {

    const file = this.files[0];

    if (!file) return;


    if (!currentUser) {

      app.toast(
        "ابتدا وارد حساب شوید.",
        "error"
      );

      return;
    }


    // محدودیت حجم
    if (file.size > 5 * 1024 * 1024) {

      app.toast(
        "حجم عکس باید کمتر از ۵ مگابایت باشد.",
        "error"
      );

      this.value = "";
      return;
    }


    // فقط عکس
    if (!file.type.startsWith("image/")) {

      app.toast(
        "لطفاً یک فایل تصویری انتخاب کن.",
        "error"
      );

      this.value = "";
      return;
    }


    try {

      setStatus(
        "در حال آپلود عکس...",
        "info"
      );


      const extension =
        file.name.split(".").pop().toLowerCase();


      const fileName =
        currentUser.id +
        "/" +
        Date.now() +
        "." +
        extension;


      // آپلود به Storage
      const {
        error: uploadError
      } = await sb.storage
        .from("avatars")
        .upload(
          fileName,
          file,
          {
            cacheControl: "3600",
            upsert: true
          }
        );


      if (uploadError) {

        console.error(uploadError);

        setStatus(
          "آپلود عکس انجام نشد: " +
          uploadError.message,
          "error"
        );

        return;
      }


      // گرفتن لینک عمومی
      const {
        data: publicData
      } = sb.storage
        .from("avatars")
        .getPublicUrl(fileName);


      const avatarUrl =
        publicData.publicUrl;


      // ذخیره لینک در profiles
      const {
        error: updateError
      } = await sb
        .from("profiles")
        .update({
          avatar_url: avatarUrl
        })
        .eq("id", currentUser.id);


      if (updateError) {

        console.error(updateError);

        setStatus(
          "عکس آپلود شد اما ذخیره لینک آن انجام نشد: " +
          updateError.message,
          "error"
        );

        return;
      }


      // نمایش عکس جدید
      document.getElementById(
        "avatarPreview"
      ).src = avatarUrl;


      // بروزرسانی session محلی
      if (window.app) {
        await app.saveLocalSession();
      }


      setStatus(
        "عکس پروفایل با موفقیت تغییر کرد. ✅",
        "success"
      );


      app.toast(
        "عکس پروفایل ذخیره شد.",
        "success"
      );


    } catch (error) {

      console.error(error);

      setStatus(
        "خطا هنگام آپلود عکس.",
        "error"
      );

    }

  });


// شروع صفحه
document.addEventListener(
  "DOMContentLoaded",
  function () {

    loadAccount();

  }
);

</script>

</body>
</html>
