<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ورود و ثبت‌نام | Lamine Yamal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      min-height: 100vh;
      background: #f5f7fb;
      color: #172033;
      transition: .3s;
    }

    body.dark {
      background: #101522;
      color: #f4f7ff;
    }

    header {
      background: rgba(255,255,255,.95);
      border-bottom: 1px solid #e5e7eb;
    }

    body.dark header {
      background: #101522;
      border-color: #293247;
    }

    nav {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #2563eb;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
    }

    .back {
      text-decoration: none;
      color: #2563eb;
    }

    .container {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .box {
      width: 100%;
      max-width: 460px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 25px;
      padding: 35px;
      box-shadow: 0 20px 50px rgba(0,0,0,.08);
    }

    body.dark .box {
      background: #171e2d;
      border-color: #293247;
    }

    .title {
      text-align: center;
      margin-bottom: 30px;
    }

    .title .icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .title h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .title p {
      color: #667085;
      line-height: 1.8;
    }

    body.dark .title p {
      color: #bac4d5;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 25px;
      background: #f1f4f9;
      padding: 5px;
      border-radius: 12px;
    }

    body.dark .tabs {
      background: #20283a;
    }

    .tab {
      border: none;
      padding: 11px;
      border-radius: 9px;
      cursor: pointer;
      font-family: inherit;
      background: transparent;
      color: inherit;
    }

    .tab.active {
      background: #2563eb;
      color: white;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce1ea;
      border-radius: 12px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      background: white;
      color: #172033;
    }

    body.dark .form-group input {
      background: #101522;
      color: white;
      border-color: #303a50;
    }

    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    .submit {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      margin-top: 5px;
    }

    .submit:hover {
      background: #1d4ed8;
    }

    .submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      line-height: 1.8;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .dark-toggle {
      position: fixed;
      left: 20px;
      bottom: 20px;
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 19px;
    }

    .note {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #7b8495;
      line-height: 1.8;
    }

    @media (max-width: 500px) {
      .box {
        padding: 25px 20px;
      }

      .title h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <nav>
    <a href="index.html" class="logo">
      ⚽ Lamine Yamal
    </a>

    <a href="index.html" class="back">
      ← بازگشت به خانه
    </a>
  </nav>
</header>

<main class="container">

  <section class="box">

    <div class="title">

      <div class="icon">👤</div>

      <h1 id="title">
        ورود به حساب
      </h1>

      <p id="subtitle">
        وارد حساب کاربری خود شوید
      </p>

    </div>

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        onclick="showLogin()"
      >
        ورود
      </button>

      <button
        class="tab"
        id="registerTab"
        onclick="showRegister()"
      >
        ثبت‌نام
      </button>

    </div>


    <!-- Login -->

    <form id="loginForm">

      <div class="form-group">

        <label for="loginEmail">
          ایمیل
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="example@email.com"
          required
        >

      </div>


      <div class="form-group">

        <label for="loginPassword">
          رمز عبور
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="رمز عبور"
          required
        >

      </div>


      <button
        type="submit"
        class="submit"
        id="loginButton"
      >
        ورود
      </button>

    </form>


    <!-- Register -->

    <form id="registerForm" style="display:none;">

      <div class="form-group">

        <label for="registerUsername">
          نام کاربری
        </label>

        <input
          type="text"
          id="registerUsername"
          placeholder="مثلاً Alisan"
          minlength="3"
          maxlength="30"
          required
        >

      </div>


      <div class="form-group">

        <label for="registerEmail">
          ایمیل
        </label>

        <input
          type="email"
          id="registerEmail"
          placeholder="example@email.com"
          required
        >

      </div>


      <div class="form-group">

        <label for="registerPassword">
          رمز عبور
        </label>

        <input
          type="password"
          id="registerPassword"
          placeholder="حداقل 6 کاراکتر"
          minlength="6"
          required
        >

      </div>


      <button
        type="submit"
        class="submit"
        id="registerButton"
      >
        ساخت حساب
      </button>

    </form>


    <div id="message" class="message"></div>

    <div class="note">
      اطلاعات حساب از طریق Supabase مدیریت می‌شود.
    </div>

  </section>

</main>


<button
  class="dark-toggle"
  onclick="toggleDarkMode()"
  id="darkButton"
>
  🌙
</button>


<script>

const SUPABASE_URL =
  "https://kcnxopqwqzxhzaciskwq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_snszD0JjmcAF8f9BDgKbfg_DezmJl6Y";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const loginForm =
  document.getElementById("loginForm");

const registerForm =
  document.getElementById("registerForm");

const message =
  document.getElementById("message");


function showLogin() {

  loginForm.style.display = "block";
  registerForm.style.display = "none";

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("registerTab")
    .classList.remove("active");

  document.getElementById("title").textContent =
    "ورود به حساب";

  document.getElementById("subtitle").textContent =
    "وارد حساب کاربری خود شوید";

  clearMessage();
}


function showRegister() {

  loginForm.style.display = "none";
  registerForm.style.display = "block";

  document
    .getElementById("registerTab")
    .classList.add("active");

  document
    .getElementById("loginTab")
    .classList.remove("active");

  document.getElementById("title").textContent =
    "ساخت حساب";

  document.getElementById("subtitle").textContent =
    "یک حساب جدید بسازید";

  clearMessage();
}


function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;
}


function clearMessage() {

  message.textContent = "";

  message.className =
    "message";
}


loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const button =
      document.getElementById("loginButton");

    button.disabled = true;
    button.textContent = "در حال ورود...";

    clearMessage();

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      showMessage(
        "ورود ناموفق بود: " + error.message,
        "error"
      );

      button.disabled = false;
      button.textContent = "ورود";

      return;
    }

    if (data.user) {

      localStorage.setItem(
        "yamalSession",
        data.user.id
      );

      showMessage(
        "ورود موفق بود! در حال انتقال...",
        "success"
      );

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 800);
    }

  }
);


registerForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const username =
      document
        .getElementById("registerUsername")
        .value
        .trim();

    const email =
      document
        .getElementById("registerEmail")
        .value
        .trim();

    const password =
      document.getElementById("registerPassword").value;

    const button =
      document.getElementById("registerButton");

    if (username.length < 3) {

      showMessage(
        "نام کاربری باید حداقل ۳ حرف باشد.",
        "error"
      );

      return;
    }

    button.disabled = true;
    button.textContent = "در حال ساخت حساب...";

    clearMessage();

    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {
          data: {
            username: username
          }
        }

      });


    if (error) {

      showMessage(
        "ثبت‌نام ناموفق بود: " + error.message,
        "error"
      );

      button.disabled = false;
      button.textContent = "ساخت حساب";

      return;
    }


    if (data.user) {

      localStorage.setItem(
        "yamalSession",
        data.user.id
      );

      if (data.session) {

        showMessage(
          "حساب با موفقیت ساخته شد! در حال انتقال...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);

      } else {

        showMessage(
          "حساب ساخته شد. ایمیل خود را برای تأیید بررسی کنید.",
          "success"
        );

        button.disabled = false;
        button.textContent = "ساخت حساب";
      }
    }

  }
);


function toggleDarkMode() {

  document.body.classList.toggle("dark");

  const dark =
    document.body.classList.contains("dark");

  localStorage.setItem(
    "yamalDarkMode",
    dark ? "true" : "false"
  );

  document.getElementById("darkButton").textContent =
    dark ? "☀️" : "🌙";
}


function loadDarkMode() {

  const dark =
    localStorage.getItem("yamalDarkMode") === "true";

  if (dark) {

    document.body.classList.add("dark");

    document.getElementById("darkButton").textContent =
      "☀️";
  }
}


loadDarkMode();

</script>

</body>
</html>
