<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>چت کاربران | Lamine Yamal</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>

<body>

<header>
  <nav>

    <a href="index.html" class="logo">
      ⚽ Lamine Yamal
    </a>

    <button
      class="mobile-menu"
      onclick="toggleMenu()"
    >
      ☰
    </button>

    <div class="nav-links" id="navLinks">

      <a href="index.html">خانه</a>
      <a href="news.html">اخبار</a>
      <a href="honors.html">افتخارات</a>
      <a href="profile.html">پروفایل یامال</a>
      <a href="dashboard.html">حساب من</a>

      <button
        id="darkButton"
        data-dark-mode
        onclick="toggleDarkMode()"
      >
        🌙
      </button>

      <button
        data-logout
        onclick="logout()"
      >
        🚪 خروج
      </button>

    </div>

  </nav>
</header>


<main>

<section class="section">

  <div class="section-title">

    <h2>💬 چت هواداران</h2>

    <p>
      کاربران سایت را جستجو کن و با آنها گفتگو کن.
    </p>

  </div>


  <div
    class="chat-container"
    style="
      max-width:1000px;
      margin:auto;
      display:grid;
      grid-template-columns:320px 1fr;
      gap:20px;
    "
  >


    <!-- کاربران -->

    <div
      class="card"
      style="
        padding:20px;
        text-align:right;
        height:650px;
        overflow:hidden;
      "
    >

      <h3 style="margin-bottom:15px;">
        👥 کاربران
      </h3>


      <input
        type="text"
        id="searchUsers"
        placeholder="🔎 جستجوی نام کاربری..."
        autocomplete="off"
      >


      <div
        id="usersList"
        style="
          margin-top:15px;
          height:540px;
          overflow-y:auto;
        "
      >

        <p style="text-align:center;">
          در حال بارگذاری کاربران...
        </p>

      </div>

    </div>


    <!-- بخش چت -->

    <div
      class="card"
      style="
        padding:0;
        height:650px;
        overflow:hidden;
        display:flex;
        flex-direction:column;
      "
    >


      <!-- عنوان چت -->

      <div
        id="chatHeader"
        style="
          padding:18px;
          border-bottom:1px solid #293247;
          font-weight:bold;
          font-size:18px;
        "
      >
        💬 یک کاربر را انتخاب کن
      </div>


      <!-- پیام‌ها -->

      <div
        id="messages"
        style="
          flex:1;
          padding:20px;
          overflow-y:auto;
          display:flex;
          flex-direction:column;
          gap:10px;
        "
      >

        <div
          style="
            text-align:center;
            margin:auto;
            opacity:.7;
          "
        >
          برای شروع، یک کاربر را انتخاب کن.
        </div>

      </div>


      <!-- ارسال پیام -->

      <form
        id="messageForm"
        style="
          display:flex;
          gap:10px;
          padding:15px;
          border-top:1px solid #293247;
        "
      >

        <input
          id="messageInput"
          type="text"
          maxlength="2000"
          placeholder="پیامت را بنویس..."
          autocomplete="off"
          disabled
        >

        <button
          type="submit"
          class="btn btn-primary"
          id="sendButton"
          disabled
          style="
            border:none;
            cursor:pointer;
            white-space:nowrap;
          "
        >
          ارسال 📤
        </button>

      </form>

    </div>

  </div>

</section>

</main>


<footer>

  <p>
    © 2026 Lamine Yamal Fan Website
  </p>

</footer>


<script src="app.js"></script>


<script>

let currentUser = null;
let selectedUser = null;
let allUsers = [];
let realtimeChannel = null;


// عکس پیش‌فرض
function defaultAvatar() {

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="100"
           height="100">

        <rect width="100"
              height="100"
              fill="#e8eefc"/>

        <circle
          cx="50"
          cy="36"
          r="18"
          fill="#2563eb"/>

        <path
          d="M18 90
             C22 65 36 56 50 56
             C64 56 78 65 82 90"
          fill="#2563eb"/>

      </svg>
    `);

}


// دریافت کاربر فعلی
async function loadCurrentUser() {

  const {
    data,
    error
  } = await sb.auth.getUser();

  if (error || !data.user) {

    window.location.href = "login.html";
    return false;

  }

  currentUser = data.user;

  return true;

}


// بارگذاری کاربران
async function loadUsers() {

  const usersList =
    document.getElementById("usersList");

  try {

    const {
      data,
      error
    } = await sb
      .from("profiles")
      .select("id, username, avatar_url")
      .neq("id", currentUser.id)
      .order("username", {
        ascending: true
      });


    if (error) {

      console.error(error);

      usersList.innerHTML = `
        <p style="color:#dc2626;text-align:center;">
          خطا در بارگذاری کاربران
        </p>
      `;

      return;

    }


    allUsers = data || [];

    renderUsers(allUsers);

  } catch (error) {

    console.error(error);

    usersList.innerHTML = `
      <p style="color:#dc2626;text-align:center;">
        خطا در ارتباط با سرور
      </p>
    `;

  }

}


// نمایش کاربران
function renderUsers(users) {

  const usersList =
    document.getElementById("usersList");

  if (!users.length) {

    usersList.innerHTML = `
      <p style="text-align:center;opacity:.7;">
        کاربری پیدا نشد.
      </p>
    `;

    return;

  }


  usersList.innerHTML = "";


  users.forEach(user => {

    const item =
      document.createElement("button");


    item.type = "button";


    item.style.cssText = `
      width:100%;
      border:none;
      background:transparent;
      color:inherit;
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px;
      border-radius:12px;
      cursor:pointer;
      margin-bottom:5px;
      text-align:right;
      font-family:inherit;
    `;


    item.onmouseover = function() {
      this.style.background =
        document.body.classList.contains("dark")
          ? "#202a3d"
          : "#eef2ff";
    };


    item.onmouseout = function() {

      if (
        !selectedUser ||
        selectedUser.id !== user.id
      ) {

        this.style.background =
          "transparent";

      }

    };


    const avatar =
      document.createElement("img");


    avatar.src =
      user.avatar_url ||
      defaultAvatar();


    avatar.onerror = function() {
      this.src = defaultAvatar();
    };


    avatar.style.cssText = `
      width:48px;
      height:48px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid #2563eb;
      flex-shrink:0;
    `;


    const info =
      document.createElement("div");


    info.innerHTML = `
      <strong>
        @${escapeHTML(user.username || "کاربر")}
      </strong>

      <div
        style="
          font-size:12px;
          opacity:.6;
          margin-top:3px;
        "
      >
        برای گفتگو انتخاب کن
      </div>
    `;


    item.appendChild(avatar);
    item.appendChild(info);


    item.onclick = function() {

      selectUser(user);

    };


    usersList.appendChild(item);

  });

}


// جلوگیری از HTML خطرناک
function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    String(text || "");

  return div.innerHTML;

}


// انتخاب کاربر
async function selectUser(user) {

  selectedUser = user;


  document.getElementById(
    "chatHeader"
  ).innerHTML = `
    💬 گفتگو با
    <strong>
      @${escapeHTML(user.username)}
    </strong>
  `;


  document.getElementById(
    "messageInput"
  ).disabled = false;


  document.getElementById(
    "sendButton"
  ).disabled = false;


  await loadMessages();


  subscribeRealtime();

}


// بارگذاری پیام‌ها
async function loadMessages() {

  const messagesBox =
    document.getElementById("messages");


  messagesBox.innerHTML = `
    <div style="text-align:center;opacity:.6;margin:auto;">
      در حال بارگذاری پیام‌ها...
    </div>
  `;


  const {
    data,
    error
  } = await sb
    .from("messages")
    .select(`
      id,
      sender_id,
      receiver_id,
      content,
      created_at
    `)
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at", {
      ascending: true
    });


  if (error) {

    console.error(error);

    messagesBox.innerHTML = `
      <p style="color:#dc2626;text-align:center;">
        خطا در دریافت پیام‌ها
      </p>
    `;

    return;

  }


  messagesBox.innerHTML = "";


  if (!data || !data.length) {

    messagesBox.innerHTML = `
      <div style="text-align:center;opacity:.6;margin:auto;">
        هنوز پیامی وجود ندارد.<br>
        اولین پیام را ارسال کن 👋
      </div>
    `;

    return;

  }


  data.forEach(message => {

    addMessageToScreen(
      message,
      false
    );

  });


  scrollMessages();

}


// نمایش یک پیام
function addMessageToScreen(
  message,
  scroll = true
) {

  const messagesBox =
    document.getElementById("messages");


  const mine =
    message.sender_id === currentUser.id;


  const wrapper =
    document.createElement("div");


  wrapper.style.display = "flex";


  wrapper.style.justifyContent =
    mine
      ? "flex-start"
      : "flex-end";


  const bubble =
    document.createElement("div");


  bubble.style.maxWidth = "75%";
  bubble.style.padding = "10px 14px";
  bubble.style.borderRadius = "15px";
  bubble.style.lineHeight = "1.7";


  if (mine) {

    bubble.style.background =
      "#2563eb";

    bubble.style.color =
      "#fff";

  } else {

    bubble.style.background =
      document.body.classList.contains("dark")
        ? "#293247"
        : "#e8eefc";

  }


  const date =
    new Date(message.created_at);


  const time =
    date.toLocaleTimeString(
      "fa-IR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  bubble.innerHTML = `
    <div>
      ${escapeHTML(message.content)}
    </div>

    <div
      style="
        font-size:10px;
        opacity:.65;
        margin-top:3px;
      "
    >
      ${time}
    </div>
  `;


  wrapper.appendChild(bubble);

  messagesBox.appendChild(wrapper);


  if (scroll) {

    scrollMessages();

  }

}


// اسکرول به پایین
function scrollMessages() {

  const box =
    document.getElementById("messages");

  box.scrollTop =
    box.scrollHeight;

}


// ارسال پیام
document
  .getElementById("messageForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      if (
        !currentUser ||
        !selectedUser
      ) {

        return;

      }


      const input =
        document.getElementById(
          "messageInput"
        );


      const content =
        input.value.trim();


      if (!content) return;


      input.disabled = true;


      const {
        data,
        error
      } = await sb
        .from("messages")
        .insert({
          sender_id: currentUser.id,
          receiver_id: selectedUser.id,
          content: content
        })
        .select()
        .single();


      input.disabled = false;


      if (error) {

        console.error(error);

        app.toast(
          "ارسال پیام انجام نشد.",
          "error"
        );

        return;

      }


      input.value = "";


      addMessageToScreen(
        data,
        true
      );

    }
  );


// جستجوی کاربران
document
  .getElementById("searchUsers")
  .addEventListener(
    "input",
    function() {

      const query =
        this.value
          .trim()
          .toLowerCase();


      if (!query) {

        renderUsers(allUsers);

        return;

      }


      const filtered =
        allUsers.filter(user =>
          String(
            user.username || ""
          )
          .toLowerCase()
          .includes(query)
        );


      renderUsers(filtered);

    }
  );


// Realtime
function subscribeRealtime() {

  if (realtimeChannel) {

    sb.removeChannel(
      realtimeChannel
    );

  }


  if (!selectedUser) return;


  realtimeChannel =
    sb
      .channel(
        "chat-" +
        currentUser.id +
        "-" +
        selectedUser.id +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        payload => {

          const message =
            payload.new;


          const belongsToChat =
            (
              message.sender_id ===
                currentUser.id &&
              message.receiver_id ===
                selectedUser.id
            )
            ||
            (
              message.sender_id ===
                selectedUser.id &&
              message.receiver_id ===
                currentUser.id
            );


          if (
            belongsToChat &&
            message.sender_id !==
              currentUser.id
          ) {

            addMessageToScreen(
              message,
              true
            );

          }

        }
      )
      .subscribe();

}


// شروع
async function initChat() {

  const loggedIn =
    await loadCurrentUser();


  if (!loggedIn) return;


  await loadUsers();

}


document.addEventListener(
  "DOMContentLoaded",
  initChat
);

</script>

@media(max-width:850px) {

  .chat-container {

    grid-template-columns:1fr !important;

  }

  .chat-container > .card:first-child {

    height:300px !important;

  }

  .chat-container > .card:first-child
  #usersList {

    height:190px !important;

  }

  .chat-container > .card:last-child {

    height:600px !important;

  }

}

</style>

</body>
</html>
