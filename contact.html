<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ارتباط با ما | Lamine Yamal</title>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      transition: .3s;
    }

    body.dark {
      background: #101522;
      color: #f4f7ff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #e5e7eb;
    }

    body.dark header {
      background: rgba(16,21,34,.95);
      border-color: #293247;
    }

    nav {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #2563eb;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links a,
    .nav-links button {
      border: none;
      background: transparent;
      color: inherit;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-links a:hover,
    .nav-links button:hover {
      background: #eaf0ff;
      color: #2563eb;
    }

    body.dark .nav-links a:hover,
    body.dark .nav-links button:hover {
      background: #202a3d;
    }

    .mobile-menu {
      display: none;
      border: none;
      background: #eaf0ff;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
    }

    body.dark .mobile-menu {
      background: #202a3d;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 55px 20px;
    }

    .title {
      text-align: center;
      margin-bottom: 35px;
    }

    .title h1 {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .title p {
      color: #667085;
      line-height: 1.8;
    }

    body.dark .title p {
      color: #bac4d5;
    }

    .contact-box {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 25px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(0,0,0,.05);
    }

    body.dark .contact-box {
      background: #171e2d;
      border-color: #293247;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce1ea;
      border-radius: 12px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      background: white;
      color: #172033;
    }

    body.dark .form-group input,
    body.dark .form-group textarea {
      background: #101522;
      color: white;
      border-color: #303a50;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    textarea {
      min-height: 170px;
      resize: vertical;
    }

    .submit {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:hover {
      background: #1d4ed8;
    }

    .submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      line-height: 1.8;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    footer {
      margin-top: 50px;
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 800px) {

      .nav-links {
        display: none;
        position: absolute;
        top: 70px;
        right: 15px;
        left: 15px;
        background: white;
        padding: 15px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,.12);
        flex-direction: column;
      }

      body.dark .nav-links {
        background: #171e2d;
      }

      .nav-links.open {
        display: flex;
      }

      .mobile-menu {
        display: block;
      }

      .contact-box {
        padding: 25px 20px;
      }

      .title h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header>

  <nav>

    <a href="index.html" class="logo">
      ⚽ Lamine Yamal
    </a>

    <button
      class="mobile-menu"
      onclick="toggleMenu()"
    >
      ☰
    </button>

    <div class="nav-links" id="navLinks">

      <a href="index.html">خانه</a>
      <a href="news.html">اخبار</a>
      <a href="honors.html">افتخارات</a>
      <a href="profile.html">پروفایل</a>
      <a href="contact.html">ارتباط با ما</a>

      <button
        onclick="toggleDarkMode()"
        id="darkButton"
      >
        🌙
      </button>

    </div>

  </nav>

</header>


<main class="container">

  <div class="title">

    <h1>📩 ارتباط با ما</h1>

    <p>
      اگر پیشنهادی، نظری یا پیامی دارید، از فرم زیر برای
      ارسال پیام استفاده کنید.
    </p>

  </div>


  <section class="contact-box">

    <form id="contactForm">

      <div class="form-group">

        <label for="name">
          نام
        </label>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="نام شما"
          required
        >

      </div>


      <div class="form-group">

        <label for="email">
          ایمیل
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          required
        >

      </div>


      <div class="form-group">

        <label for="messageText">
          پیام
        </label>

        <textarea
          id="messageText"
          name="message"
          placeholder="پیام خود را بنویسید..."
          required
        ></textarea>

      </div>


      <button
        type="submit"
        class="submit"
        id="sendButton"
      >
        📤 ارسال پیام
      </button>

    </form>


    <div
      id="statusMessage"
      class="message"
    ></div>

  </section>

</main>


<footer>

  <p>
    © 2026 Lamine Yamal Fan Website
  </p>

  <p style="margin-top:10px; opacity:.7;">
    ساخته شده برای هواداران فوتبال ⚽
  </p>

</footer>


<script>

const EMAILJS_PUBLIC_KEY =
  "UrmDIfyGXYH0n1QeS";

const EMAILJS_SERVICE_ID =
  "service_nfzwg99";

const EMAILJS_TEMPLATE_ID =
  "template_ch7tvtg";


emailjs.init({
  publicKey: EMAILJS_PUBLIC_KEY
});


const contactForm =
  document.getElementById("contactForm");

const sendButton =
  document.getElementById("sendButton");

const statusMessage =
  document.getElementById("statusMessage");


contactForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    sendButton.disabled = true;
    sendButton.textContent =
      "در حال ارسال...";

    statusMessage.className =
      "message";

    statusMessage.textContent = "";

    try {

      await emailjs.sendForm(
        EMAILJS_SERVICE_ID,
        EMAILJS_TEMPLATE_ID,
        contactForm
      );

      statusMessage.className =
        "message success";

      statusMessage.textContent =
        "✅ پیام شما با موفقیت ارسال شد.";

      contactForm.reset();

    } catch (error) {

      console.error(error);

      statusMessage.className =
        "message error";

      statusMessage.textContent =
        "❌ ارسال پیام انجام نشد. تنظیمات EmailJS را بررسی کنید.";

    }

    sendButton.disabled = false;

    sendButton.textContent =
      "📤 ارسال پیام";

  }
);


function toggleDarkMode() {

  document.body.classList.toggle("dark");

  const dark =
    document.body.classList.contains("dark");

  localStorage.setItem(
    "yamalDarkMode",
    dark ? "true" : "false"
  );

  document.getElementById("darkButton").textContent =
    dark ? "☀️" : "🌙";
}


function loadDarkMode() {

  const dark =
    localStorage.getItem("yamalDarkMode") === "true";

  if (dark) {

    document.body.classList.add("dark");

    document.getElementById("darkButton").textContent =
      "☀️";
  }
}


function toggleMenu() {

  document
    .getElementById("navLinks")
    .classList.toggle("open");
}


loadDarkMode();

</script>

</body>
</html>
