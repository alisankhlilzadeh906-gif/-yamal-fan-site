<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تماس با ما | Lamine Yamal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      transition: 0.3s;
    }

    nav {
      background: #111;
      color: white;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #ffd700;
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu a,
    .dark-btn {
      color: white;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .menu a:hover,
    .dark-btn:hover {
      background: #333;
    }

    .dark-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
    }

    .hamburger {
      display: none;
      font-size: 28px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
    }

    .hero {
      background: linear-gradient(135deg, #004d98, #a50044);
      color: white;
      text-align: center;
      padding: 55px 20px;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 45px 20px;
    }

    .contact-box {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    .contact-box h2 {
      text-align: center;
      color: #004d98;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-family: inherit;
      font-size: 16px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .send-btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #004d98;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .send-btn:hover {
      background: #00376e;
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success,
    .error {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      text-align: center;
    }

    .success {
      background: #d9f7df;
      color: #126b25;
    }

    .error {
      background: #ffdede;
      color: #a00000;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 20px;
    }

    body.dark {
      background: #181818;
      color: white;
    }

    body.dark .contact-box {
      background: #252525;
    }

    body.dark .contact-box h2 {
      color: #66aaff;
    }

    body.dark input,
    body.dark textarea {
      background: #333;
      color: white;
      border-color: #555;
    }

    @media (max-width: 768px) {

      nav {
        padding: 14px 18px;
      }

      .hamburger {
        display: block;
      }

      .menu {
        position: absolute;
        top: 60px;
        right: 0;
        width: 100%;
        background: #111;
        display: none;
        flex-direction: column;
        align-items: stretch;
        padding: 10px;
        box-shadow: 0 8px 15px rgba(0,0,0,0.3);
      }

      .menu.active {
        display: flex;
      }

      .menu a,
      .dark-btn {
        width: 100%;
        text-align: center;
        padding: 13px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .contact-box {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <nav>

    <div class="logo">
      LAMINE YAMAL
    </div>

    <button class="hamburger" onclick="toggleMenu()">
      ☰
    </button>

    <div class="menu" id="menu">

      <a href="index.html">خانه</a>
      <a href="news.html">اخبار</a>
      <a href="honors.html">افتخارات</a>
      <a href="profile.html">پروفایل</a>
      <a href="contact.html">تماس با ما</a>

      <a href="login.html" id="accountLink">
        ورود / ثبت‌نام
      </a>

      <button class="dark-btn" onclick="toggleDarkMode()">
        🌙 حالت تاریک
      </button>

    </div>

  </nav>


  <section class="hero">

    <h1>📩 تماس با ما</h1>

    <p>
      پیام خودت را برای ما ارسال کن
    </p>

  </section>


  <main class="container">

    <div class="contact-box">

      <h2>
        ارسال پیام
      </h2>

      <form id="contact-form">

        <label for="name">
          نام
        </label>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="نام خود را وارد کنید"
          required
        >

        <label for="email">
          ایمیل
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          required
        >

        <label for="message">
          پیام
        </label>

        <textarea
          id="message"
          name="message"
          placeholder="پیام خود را بنویسید..."
          required
        ></textarea>

        <button
          type="submit"
          class="send-btn"
          id="sendButton">
          ارسال پیام
        </button>

      </form>

      <div id="successMessage" class="success">
        ✅ پیام شما با موفقیت ارسال شد!
      </div>

      <div id="errorMessage" class="error">
        ❌ ارسال پیام ناموفق بود. دوباره تلاش کنید.
      </div>

    </div>

  </main>


  <footer>
    <p>
      © 2026 Lamine Yamal Fan Website
    </p>
  </footer>


  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>

    /* EmailJS */

    emailjs.init({
      publicKey: "UrmDIfyGXYH0n1QeS"
    });


    /* Mobile Menu */

    function toggleMenu() {

      document
        .getElementById("menu")
        .classList.toggle("active");

    }


    /* Close menu */

    document.querySelectorAll(".menu a").forEach(function(link) {

      link.addEventListener("click", function() {

        document
          .getElementById("menu")
          .classList.remove("active");

      });

    });


    /* Dark Mode */

    function toggleDarkMode() {

      document.body.classList.toggle("dark");

      localStorage.setItem(
        "yamalDarkMode",
        document.body.classList.contains("dark")
      );

    }


    if (
      localStorage.getItem("yamalDarkMode") === "true"
    ) {

      document.body.classList.add("dark");

    }


    /* Account */

    function updateAccount() {

      const accountLink =
        document.getElementById("accountLink");

      const session =
        localStorage.getItem("yamalSession");

      if (session) {

        try {

          const user =
            JSON.parse(session);

          if (user.username) {

            accountLink.textContent =
              "👤 " + user.username;

          }

        } catch (error) {

          console.log("Session error");

        }

      }

    }

    updateAccount();


    /* Contact Form */

    const contactForm =
      document.getElementById("contact-form");

    const sendButton =
      document.getElementById("sendButton");

    const successMessage =
      document.getElementById("successMessage");

    const errorMessage =
      document.getElementById("errorMessage");


    contactForm.addEventListener("submit", function(event) {

      event.preventDefault();

      successMessage.style.display = "none";
      errorMessage.style.display = "none";

      sendButton.disabled = true;
      sendButton.textContent = "در حال ارسال...";


      emailjs.sendForm(
        "service_nfzwg99",
        "template_ch7tvtg",
        contactForm
      )

      .then(function() {

        successMessage.style.display = "block";

        contactForm.reset();

        sendButton.disabled = false;
        sendButton.textContent = "ارسال پیام";

      })

      .catch(function(error) {

        console.error("EmailJS Error:", error);

        errorMessage.style.display = "block";

        sendButton.disabled = false;
        sendButton.textContent = "ارسال پیام";

      });

    });

  </script>

</body>
</html>
