<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود و ثبت‌نام</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      transition: 0.3s;
    }

    nav {
      background: #111;
      color: white;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #ffd700;
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu a,
    .dark-btn {
      color: white;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .menu a:hover,
    .dark-btn:hover {
      background: #333;
    }

    .dark-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
    }

    .hamburger {
      display: none;
      font-size: 28px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
    }

    .hero {
      background: linear-gradient(135deg, #004d98, #a50044);
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
    }

    .container {
      max-width: 500px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .account-box {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.12);
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: #eee;
      cursor: pointer;
      font-size: 16px;
    }

    .tab:first-child {
      border-radius: 10px 0 0 10px;
    }

    .tab:last-child {
      border-radius: 0 10px 10px 0;
    }

    .tab.active {
      background: #004d98;
      color: white;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin: 12px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    .main-btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #004d98;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .main-btn:hover {
      background: #00376e;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .success {
      background: #d9f7df;
      color: #126b25;
    }

    .error {
      background: #ffdede;
      color: #9b1111;
    }

    .welcome {
      text-align: center;
      display: none;
    }

    .welcome h2 {
      color: #004d98;
      margin-bottom: 15px;
    }

    .logout-btn {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 9px;
      background: #a50044;
      color: white;
      cursor: pointer;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 40px;
    }

    body.dark {
      background: #181818;
      color: white;
    }

    body.dark .account-box {
      background: #252525;
    }

    body.dark .tab {
      background: #333;
      color: white;
    }

    body.dark .tab.active {
      background: #0066cc;
    }

    body.dark .welcome h2 {
      color: #66aaff;
    }

    @media (max-width: 768px) {
      nav {
        padding: 14px 18px;
      }

      .hamburger {
        display: block;
      }

      .menu {
        position: absolute;
        top: 60px;
        right: 0;
        width: 100%;
        background: #111;
        display: none;
        flex-direction: column;
        align-items: stretch;
        padding: 10px;
        box-shadow: 0 8px 15px rgba(0,0,0,.3);
      }

      .menu.active {
        display: flex;
      }

      .menu a,
      .dark-btn {
        width: 100%;
        text-align: center;
        padding: 13px;
      }

      .hero h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">LAMINE YAMAL</div>

    <button class="hamburger" onclick="toggleMenu()">☰</button>

    <div class="menu" id="menu">
      <a href="index.html">خانه</a>
      <a href="news.html">اخبار</a>
      <a href="honors.html">افتخارات</a>
      <a href="profile.html">پروفایل</a>
      <a href="contact.html">تماس با ما</a>
      <a href="login.html" id="accountLink">ورود / ثبت‌نام</a>
      <button class="dark-btn" onclick="toggleDarkMode()">🌙 حالت تاریک</button>
    </div>
  </nav>

  <section class="hero">
    <h1>👤 حساب کاربری</h1>
    <p>ورود یا ساخت حساب در سایت هواداری لامین یامال</p>
  </section>

  <main class="container">

    <div class="account-box">

      <div id="accountForms">

        <div class="tabs">
          <button class="tab active" onclick="showForm('login')" id="loginTab">
            ورود
          </button>

          <button class="tab" onclick="showForm('register')" id="registerTab">
            ثبت‌نام
          </button>
        </div>

        <!-- LOGIN -->

        <div class="form active" id="loginForm">

          <label>ایمیل</label>

          <input
            type="email"
            id="loginEmail"
            placeholder="ایمیل"
          >

          <label>رمز عبور</label>

          <input
            type="password"
            id="loginPassword"
            placeholder="رمز عبور"
          >

          <button class="main-btn" onclick="login()">
            ورود
          </button>

          <div id="loginMessage" class="message"></div>

        </div>


        <!-- REGISTER -->

        <div class="form" id="registerForm">

          <label>نام کاربری</label>

          <input
            type="text"
            id="registerUsername"
            placeholder="نام کاربری"
          >

          <label>ایمیل</label>

          <input
            type="email"
            id="registerEmail"
            placeholder="example@gmail.com"
          >

          <label>رمز عبور</label>

          <input
            type="password"
            id="registerPassword"
            placeholder="رمز عبور"
          >

          <label>تکرار رمز عبور</label>

          <input
            type="password"
            id="registerPassword2"
            placeholder="تکرار رمز عبور"
          >

          <button class="main-btn" onclick="register()">
            ثبت‌نام
          </button>

          <div id="registerMessage" class="message"></div>

        </div>

      </div>


      <!-- ACCOUNT -->

      <div class="welcome" id="welcome">

        <h2 id="welcomeName"></h2>

        <p>
          با موفقیت وارد حساب کاربری شدی! 🎉
        </p>

        <button class="logout-btn" onclick="logout()">
          خروج از حساب
        </button>

      </div>

    </div>

  </main>

  <footer>
    <p>© 2026 Lamine Yamal Fan Website</p>
  </footer>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://kcnxopqwqzxhzaciskwq.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_snszD0JjmcAF8f9BDgKbfg_DezmJl6Y";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       MENU
    ========================= */

    function toggleMenu() {
      document
        .getElementById("menu")
        .classList.toggle("active");
    }


    document
      .querySelectorAll(".menu a")
      .forEach(function(link) {

        link.addEventListener("click", function() {

          document
            .getElementById("menu")
            .classList.remove("active");

        });

      });


    /* =========================
       DARK MODE
    ========================= */

    function toggleDarkMode() {

      document.body.classList.toggle("dark");

      localStorage.setItem(
        "yamalDarkMode",
        document.body.classList.contains("dark")
      );

    }


    if (
      localStorage.getItem("yamalDarkMode") === "true"
    ) {

      document.body.classList.add("dark");

    }


    /* =========================
       FORM SWITCH
    ========================= */

    function showForm(type) {

      const loginForm =
        document.getElementById("loginForm");

      const registerForm =
        document.getElementById("registerForm");

      const loginTab =
        document.getElementById("loginTab");

      const registerTab =
        document.getElementById("registerTab");


      if (type === "login") {

        loginForm.classList.add("active");
        registerForm.classList.remove("active");

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

      } else {

        registerForm.classList.add("active");
        loginForm.classList.remove("active");

        registerTab.classList.add("active");
        loginTab.classList.remove("active");

      }

    }


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(id, text, type) {

      const box =
        document.getElementById(id);

      box.textContent = text;

      box.className =
        "message " + type;

      box.style.display = "block";

    }


    /* =========================
       REGISTER
    ========================= */

    async function register() {

      const username =
        document
          .getElementById("registerUsername")
          .value
          .trim();

      const email =
        document
          .getElementById("registerEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("registerPassword")
          .value;

      const password2 =
        document
          .getElementById("registerPassword2")
          .value;


      if (
        !username ||
        !email ||
        !password ||
        !password2
      ) {

        showMessage(
          "registerMessage",
          "لطفاً همه قسمت‌ها را پر کن.",
          "error"
        );

        return;
      }


      if (password !== password2) {

        showMessage(
          "registerMessage",
          "رمزهای عبور یکسان نیستند.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "registerMessage",
          "رمز عبور باید حداقل ۶ کاراکتر باشد.",
          "error"
        );

        return;
      }


      showMessage(
        "registerMessage",
        "در حال ساخت حساب...",
        "success"
      );


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password

          });


        if (error) {

          showMessage(
            "registerMessage",
            error.message,
            "error"
          );

          return;
        }


        if (!data.user) {

          showMessage(
            "registerMessage",
            "ساخت حساب انجام نشد.",
            "error"
          );

          return;
        }


        const userId =
          data.user.id;


        const {
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .insert({

              id: userId,

              username: username

            });


        if (profileError) {

          showMessage(
            "registerMessage",
            "حساب ساخته شد، اما ذخیره نام کاربری انجام نشد: " +
            profileError.message,
            "error"
          );

          return;
        }


        showMessage(
          "registerMessage",
          "ثبت‌نام با موفقیت انجام شد! 🎉",
          "success"
        );


        document.getElementById(
          "registerUsername"
        ).value = "";

        document.getElementById(
          "registerEmail"
        ).value = "";

        document.getElementById(
          "registerPassword"
        ).value = "";

        document.getElementById(
          "registerPassword2"
        ).value = "";


        setTimeout(function() {

          showForm("login");

        }, 1200);


      } catch (error) {

        showMessage(
          "registerMessage",
          "خطایی رخ داد. دوباره امتحان کن.",
          "error"
        );

        console.error(error);

      }

    }


    /* =========================
       LOGIN
    ========================= */

    async function login() {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;


      if (!email || !password) {

        showMessage(
          "loginMessage",
          "ایمیل و رمز عبور را وارد کن.",
          "error"
        );

        return;
      }


      showMessage(
        "loginMessage",
        "در حال ورود...",
        "success"
      );


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          showMessage(
            "loginMessage",
            "ایمیل یا رمز عبور اشتباه است.",
            "error"
          );

          return;
        }


        if (data.user) {

          await showAccount(data.user);

        }


      } catch (error) {

        showMessage(
          "loginMessage",
          "خطایی در ورود رخ داد.",
          "error"
        );

        console.error(error);

      }

    }


    /* =========================
       SHOW ACCOUNT
    ========================= */

    async function showAccount(user) {

      if (!user) {

        const result =
          await supabaseClient.auth.getUser();

        user = result.data.user;

      }


      if (!user) return;


      let username =
        user.user_metadata?.username;


      const {
        data: profile
      } =
        await supabaseClient
          .from("profiles")
          .select("username")
          .eq("id", user.id)
          .maybeSingle();


      if (profile) {

        username = profile.username;

      }


      if (!username) {

        username = user.email;

      }


      document.getElementById(
        "accountForms"
      ).style.display = "none";


      document.getElementById(
        "welcome"
      ).style.display = "block";


      document.getElementById(
        "welcomeName"
      ).textContent =
        "سلام " + username + " 👋";


      document.getElementById(
        "accountLink"
      ).textContent =
        "👤 " + username;

    }


    /* =========================
       LOGOUT
    ========================= */

    async function logout() {

      await supabaseClient.auth.signOut();

      location.reload();

    }


    /* =========================
       CHECK CURRENT SESSION
    ========================= */

    async function checkSession() {

      const {
        data
      } =
        await supabaseClient.auth.getSession();


      if (data.session) {

        await showAccount(
          data.session.user
        );

      }

    }


    checkSession();

  </script>

</body>
</html>
