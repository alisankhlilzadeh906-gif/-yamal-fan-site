<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ورود و ثبت‌نام | Lamine Yamal</title>

  <meta
    name="description"
    content="ورود و ثبت‌نام در سایت هواداری لامین یامال"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
      transition: 0.3s;
    }

    body.dark {
      background: #111;
      color: #eee;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #111;
      box-shadow: 0 2px 15px rgba(0,0,0,0.2);
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      min-height: 70px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #ffd700;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    nav a,
    .dark-btn {
      color: white;
      text-decoration: none;
      padding: 9px 11px;
      border-radius: 8px;
      transition: 0.3s;
      font-size: 14px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
    }

    nav a:hover,
    nav a.active {
      background: #ffd700;
      color: #111;
    }

    .dark-btn:hover {
      background: #333;
    }

    .menu-btn {
      display: none;
      color: white;
      background: transparent;
      border: none;
      font-size: 28px;
      cursor: pointer;
    }

    .hero {
      background: linear-gradient(135deg, #111, #252525);
      color: white;
      text-align: center;
      padding: 65px 20px;
    }

    .hero h1 {
      color: #ffd700;
      font-size: 40px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #ddd;
      font-size: 17px;
    }

    .container {
      max-width: 500px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .auth-card {
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }

    body.dark .auth-card {
      background: #1c1c1c;
      box-shadow: 0 10px 35px rgba(0,0,0,0.4);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #eee;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      transition: 0.3s;
    }

    body.dark .tab {
      background: #303030;
      color: white;
    }

    .tab.active {
      background: #ffd700;
      color: #111;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .form h2 {
      margin-bottom: 20px;
      color: #111;
    }

    body.dark .form h2 {
      color: #ffd700;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    body.dark input {
      background: #252525;
      color: white;
      border-color: #444;
    }

    input:focus {
      border-color: #ffd700;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ffd700;
      color: #111;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .main-btn:hover {
      transform: translateY(-2px);
      background: #ffcc00;
    }

    .main-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      line-height: 1.8;
      text-align: center;
      font-size: 14px;
    }

    #status.success {
      display: block;
      background: #d4edda;
      color: #155724;
    }

    #status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
    }

    #status.info {
      display: block;
      background: #fff3cd;
      color: #856404;
    }

    .user-panel {
      display: none;
      text-align: center;
    }

    .user-avatar {
      width: 85px;
      height: 85px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    .user-panel h2 {
      color: #111;
      margin-bottom: 10px;
    }

    body.dark .user-panel h2 {
      color: #ffd700;
    }

    .user-panel p {
      color: #666;
      margin-bottom: 20px;
    }

    body.dark .user-panel p {
      color: #ccc;
    }

    .logout-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #333;
    }

    footer {
      margin-top: 60px;
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 30px 20px;
    }

    footer strong {
      color: #ffd700;
    }

    @media (max-width: 850px) {
      nav {
        display: none;
        position: absolute;
        top: 70px;
        right: 0;
        left: 0;
        background: #111;
        padding: 15px;
        flex-direction: column;
      }

      nav.show {
        display: flex;
      }

      nav a,
      .dark-btn {
        width: 100%;
        text-align: center;
      }

      .menu-btn {
        display: block;
      }
    }

    @media (max-width: 500px) {
      .hero h1 {
        font-size: 30px;
      }

      .container {
        margin: 30px auto;
        padding: 0 15px;
      }

      .auth-card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="navbar">

    <a href="index.html" class="logo">
      Lamine Yamal
    </a>

    <button class="menu-btn" onclick="toggleMenu()">
      ☰
    </button>

    <nav id="navMenu">

      <a href="index.html">خانه</a>
      <a href="news.html">اخبار</a>
      <a href="stats.html">آمار</a>
      <a href="honors.html">افتخارات</a>
      <a href="profile.html">پروفایل</a>
      <a href="contact.html">تماس با ما</a>
      <a href="login.html" class="active">ورود / ثبت‌نام</a>

      <button class="dark-btn" onclick="toggleDarkMode()">
        🌙 حالت شب
      </button>

    </nav>

  </div>
</header>


<section class="hero">

  <h1>👤 حساب کاربری</h1>

  <p>
    وارد حساب خودت شو یا یک حساب جدید بساز
  </p>

</section>


<main class="container">

  <div class="auth-card">

    <!-- تب‌ها -->

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        onclick="showLogin()"
      >
        ورود
      </button>

      <button
        class="tab"
        id="signupTab"
        onclick="showSignup()"
      >
        ثبت‌نام
      </button>

    </div>


    <!-- فرم ورود -->

    <form id="loginForm" class="form active">

      <h2>🔐 ورود به حساب</h2>

      <div class="form-group">

        <label for="loginEmail">
          ایمیل
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="example@gmail.com"
          required
        >

      </div>


      <div class="form-group">

        <label for="loginPassword">
          رمز عبور
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="رمز عبور"
          required
        >

      </div>


      <button
        type="submit"
        class="main-btn"
        id="loginButton"
      >
        ورود
      </button>

    </form>


    <!-- فرم ثبت نام -->

    <form id="signupForm" class="form">

      <h2>✨ ساخت حساب جدید</h2>

      <div class="form-group">

        <label for="signupUsername">
          نام کاربری
        </label>

        <input
          type="text"
          id="signupUsername"
          placeholder="مثلاً Alisan"
          minlength="3"
          maxlength="30"
          required
        >

      </div>


      <div class="form-group">

        <label for="signupEmail">
          ایمیل
        </label>

        <input
          type="email"
          id="signupEmail"
          placeholder="example@gmail.com"
          required
        >

      </div>


      <div class="form-group">

        <label for="signupPassword">
          رمز عبور
        </label>

        <input
          type="password"
          id="signupPassword"
          placeholder="حداقل 6 کاراکتر"
          minlength="6"
          required
        >

      </div>


      <button
        type="submit"
        class="main-btn"
        id="signupButton"
      >
        ثبت‌نام
      </button>

    </form>


    <!-- وضعیت -->

    <div id="status"></div>


    <!-- پنل کاربر -->

    <div id="userPanel" class="user-panel">

      <div class="user-avatar">
        ⚽
      </div>

      <h2 id="welcomeUser">
        خوش آمدی!
      </h2>

      <p id="userEmail">
        ایمیل
      </p>

      <button
        class="logout-btn"
        onclick="logout()"
      >
        خروج از حساب
      </button>

    </div>

  </div>

</main>


<footer>

  <p>
    ساخته شده با ❤️ برای هواداران
    <strong>لامین یامال</strong>
  </p>

  <p style="margin-top:10px;">
    © 2026 Lamine Yamal Fan Site
  </p>

</footer>


<script>

  // ==========================================
  // تنظیمات Supabase
  // ==========================================

  const SUPABASE_URL =
    "https://kcnxopqwqzxhzaciskwq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_snszD0JjmcAF8f9BDgKbfg_DezmJl6Y";


  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ==========================================
  // عناصر صفحه
  // ==========================================

  const loginForm =
    document.getElementById("loginForm");

  const signupForm =
    document.getElementById("signupForm");

  const loginTab =
    document.getElementById("loginTab");

  const signupTab =
    document.getElementById("signupTab");

  const statusBox =
    document.getElementById("status");

  const userPanel =
    document.getElementById("userPanel");

  const loginButton =
    document.getElementById("loginButton");

  const signupButton =
    document.getElementById("signupButton");


  // ==========================================
  // نمایش پیام
  // ==========================================

  function showStatus(text, type) {

    statusBox.textContent = text;

    statusBox.className = type;

    statusBox.style.display = "block";

  }


  // ==========================================
  // تب ورود
  // ==========================================

  function showLogin() {

    loginForm.classList.add("active");

    signupForm.classList.remove("active");

    loginTab.classList.add("active");

    signupTab.classList.remove("active");

    statusBox.style.display = "none";

  }


  // ==========================================
  // تب ثبت نام
  // ==========================================

  function showSignup() {

    signupForm.classList.add("active");

    loginForm.classList.remove("active");

    signupTab.classList.add("active");

    loginTab.classList.remove("active");

    statusBox.style.display = "none";

  }


  // ==========================================
  // ثبت نام
  // ==========================================

  signupForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const username =
        document
          .getElementById("signupUsername")
          .value
          .trim();

      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("signupPassword")
          .value;


      if (username.length < 3) {

        showStatus(
          "❌ نام کاربری باید حداقل ۳ کاراکتر باشد.",
          "error"
        );

        return;

      }


      signupButton.disabled = true;

      signupButton.textContent =
        "⏳ در حال ثبت‌نام...";


      try {

        // ساخت حساب در Auth

        const { data, error } =
          await db.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                username: username
              }

            }

          });


        if (error) {
          throw error;
        }


        // اگر حساب ساخته شد و کاربر در دسترس بود
        if (data.user) {

          // ذخیره نام کاربری در profiles

          const { error: profileError } =
            await db
              .from("profiles")
              .upsert({

                id: data.user.id,

                username: username

              });


          if (profileError) {

            console.error(
              "Profile error:",
              profileError
            );

            showStatus(
              "حساب ساخته شد، اما ذخیره نام کاربری انجام نشد. تنظیمات دسترسی جدول profiles را بررسی کن.",
              "error"
            );

            return;

          }


          // اگر تأیید ایمیل فعال باشد

          if (!data.session) {

            showStatus(
              "✅ حساب ساخته شد. برای فعال‌سازی حساب، ایمیل خودت را بررسی کن.",
              "success"
            );

          } else {

            showStatus(
              "✅ ثبت‌نام با موفقیت انجام شد!",
              "success"
            );

            await loadUser();

          }

        }

      } catch (error) {

        console.error(error);

        showStatus(
          "❌ " + getFriendlyError(error.message),
          "error"
        );

      } finally {

        signupButton.disabled = false;

        signupButton.textContent =
          "ثبت‌نام";

      }

    }
  );


  // ==========================================
  // ورود
  // ==========================================

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;


      loginButton.disabled = true;

      loginButton.textContent =
        "⏳ در حال ورود...";


      try {

        const { data, error } =
          await db.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {
          throw error;
        }


        showStatus(
          "✅ با موفقیت وارد شدی!",
          "success"
        );


        await loadUser();

      } catch (error) {

        console.error(error);

        showStatus(
          "❌ " + getFriendlyError(error.message),
          "error"
        );

      } finally {

        loginButton.disabled = false;

        loginButton.textContent =
          "ورود";

      }

    }
  );


  // ==========================================
  // دریافت اطلاعات کاربر
  // ==========================================

  async function loadUser() {

    const {
      data: {
        user
      }
    } = await db.auth.getUser();


    if (!user) {

      userPanel.style.display = "none";

      return;

    }


    let username =
      user.user_metadata?.username;


    // گرفتن username از profiles

    try {

      const {
        data: profile
      } = await db
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .maybeSingle();


      if (
        profile &&
        profile.username
      ) {

        username =
          profile.username;

      }

    } catch (error) {

      console.log(
        "Profile fetch:",
        error
      );

    }


    if (!username) {

      username =
        "هوادار یامال";

    }


    document
      .getElementById("welcomeUser")
      .textContent =
        "سلام " + username + " 👋";


    document
      .getElementById("userEmail")
      .textContent =
        user.email;


    loginForm.style.display = "none";

    signupForm.style.display = "none";

    document.querySelector(".tabs").style.display =
      "none";

    userPanel.style.display =
      "block";

  }


  // ==========================================
  // خروج
  // ==========================================

  async function logout() {

    const {
      error
    } = await db.auth.signOut();


    if (error) {

      showStatus(
        "❌ خروج انجام نشد.",
        "error"
      );

      return;

    }


    userPanel.style.display =
      "none";

    document.querySelector(".tabs").style.display =
      "flex";

    loginForm.style.display =
      "block";

    signupForm.style.display =
      "none";

    showLogin();

    showStatus(
      "✅ از حساب خارج شدی.",
      "success"
    );

  }


  // ==========================================
  // پیام‌های قابل فهم‌تر
  // ==========================================

  function getFriendlyError(message) {

    if (!message) {
      return "یک خطای ناشناخته رخ داد.";
    }


    if (
      message.includes("Invalid login credentials")
    ) {

      return "ایمیل یا رمز عبور اشتباه است.";

    }


    if (
      message.includes("User already registered")
    ) {

      return "این ایمیل قبلاً ثبت‌نام کرده است.";

    }


    if (
      message.includes("Password should be at least")
    ) {

      return "رمز عبور باید حداقل ۶ کاراکتر باشد.";

    }


    if (
      message.includes("Email rate limit exceeded")
    ) {

      return "تعداد درخواست‌های ایمیل زیاد شده. کمی صبر کن و دوباره امتحان کن.";

    }


    if (
      message.includes("Email not confirmed")
    ) {

      return "ابتدا ایمیل خودت را تأیید کن.";

    }


    return message;

  }


  // ==========================================
  // بررسی وضعیت ورود هنگام باز شدن صفحه
  // ==========================================

  db.auth.onAuthStateChange(
    function(event, session) {

      if (session) {

        loadUser();

      }

    }
  );


  // بررسی اولیه

  loadUser();


  // ==========================================
  // حالت تاریک
  // ==========================================

  function toggleDarkMode() {

    document.body.classList.toggle("dark");

    const isDark =
      document.body.classList.contains("dark");

    localStorage.setItem(
      "yamalDarkMode",
      isDark ? "true" : "false"
    );

  }


  if (
    localStorage.getItem("yamalDarkMode") === "true"
  ) {

    document.body.classList.add("dark");

  }


  // ==========================================
  // منوی موبایل
  // ==========================================

  function toggleMenu() {

    document
      .getElementById("navMenu")
      .classList.toggle("show");

  }


  document
    .querySelectorAll("#navMenu a")
    .forEach(function(link) {

      link.addEventListener(
        "click",
        function() {

          document
            .getElementById("navMenu")
            .classList.remove("show");

        }
      );

    });

</script>

</body>
</html>
