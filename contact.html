<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>تماس با ما</title>

    <style>
        body {
            font-family: Arial;
            direction: rtl;
            background: #f1f5f9;
            text-align: center;
            margin: 0;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px;
        }

        .contact {
            background: white;
            padding: 25px;
            margin: 30px auto;
            max-width: 450px;
            border-radius: 15px;
        }

        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        a {
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <header>
        <h1>📞 تماس با ما</h1>
    </header>

    <div class="contact">

        <h2>با ما در ارتباط باشید</h2>

        <input type="text" placeholder="نام شما">

        <input type="email" placeholder="ایمیل شما">

        <textarea rows="5" placeholder="پیام شما"></textarea>

        <br>

        <button>ارسال پیام</button>

        <br><br>

        <a href="index.html">🏠 برگشت به صفحه اصلی</a>

    </div>

</body>
</html>
